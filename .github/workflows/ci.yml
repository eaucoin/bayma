name: ci

# On demand only: every run tests the whole payload, and builds and tests the
# image from it, also in a gVisor sandbox saved and restored whole. The
# payload's toolchains come from their images on GitHub's container
# registry; the toolchains job first provisions and pushes any the registry
# lacks (tooling/src/toolchains.ts). The tests run in shards, side by side
# with the image's.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# Development telemetry goes where the repository's secrets and variables of
# these OpenTelemetry names say; with none set, nothing is exported. See
# packages/core/src/telemetry/config.ts.
env:
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT }}
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_METRICS_ENDPOINT }}
  OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_LOGS_ENDPOINT }}
  OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
  OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS }}
  OTEL_EXPORTER_OTLP_METRICS_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_METRICS_HEADERS }}
  OTEL_EXPORTER_OTLP_LOGS_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_LOGS_HEADERS }}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${{ vars.OTEL_EXPORTER_OTLP_PROTOCOL }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run format:check

  toolchains:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # The payload, what provisions it, and the image built from it take
      # more disk than some runners start with free.
      - run: |
          [ "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" -ge 40 ] ||
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: bun run toolchains ensure
        env:
          GITHUB_TOKEN: ${{ github.token }}

  test:
    needs: toolchains
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [unit, checkpoint, integration]
    name: test (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
      # The payload, what provisions it, and the image built from it take
      # more disk than some runners start with free.
      - run: |
          [ "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" -ge 40 ] ||
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: bun run toolchains pull
      - run: bun run payload
      - run: bun run test:shard ${{ matrix.shard }}

  image:
    needs: toolchains
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
      # The payload, what provisions it, and the image built from it take
      # more disk than some runners start with free.
      - run: |
          [ "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" -ge 40 ] ||
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: bun run toolchains pull
      - run: bun run payload
      - run: bun run image
      - run: bun run test:e2e

  # The image saved whole and restored by gVisor's runsc, as a host that runs
  # bayma in sandboxes saves and restores it: alasio's fork of gVisor, at the
  # release alasio pins (its cluster/node/pins.json).
  sandbox:
    needs: toolchains
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GVISOR_RELEASE: 20260921.0-eaucoin.8
      GVISOR_SHA512: 5091e17365e49328af3f6fd79211ac645699db8cb4f39d940a2d140980dc6f9b11f1ff89944e1723c06a759617b8083d2de8d16ce848945a7f300ef8724db48b
      # From .7, gVisor ends a restore that fails, which docker start then reports.
      GVISOR_ENDS_FAILED_RESTORES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
      # The payload, what provisions it, and the image built from it take
      # more disk than some runners start with free.
      - run: |
          [ "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" -ge 40 ] ||
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: bun run toolchains pull
      - run: bun run payload
      - run: bun run image
      # runsc and its shim beside Docker's: Docker starts the runtime runsc's
      # sandboxes through the shim, and restores a container from a
      # checkpoint only with its experimental features on. runsc's sandboxes
      # make user namespaces, which Ubuntu's AppArmor refuses by default.
      - run: |
          curl -fsSL -o "$RUNNER_TEMP/gvisor.tar.zstd" \
            "https://github.com/eaucoin/gvisor/releases/download/release-$GVISOR_RELEASE/gvisor-x86_64.tar.zstd"
          echo "$GVISOR_SHA512  $RUNNER_TEMP/gvisor.tar.zstd" | sha512sum -c -
          mkdir "$RUNNER_TEMP/gvisor"
          zstd -dc "$RUNNER_TEMP/gvisor.tar.zstd" | tar -x -C "$RUNNER_TEMP/gvisor"
          sudo cp -r "$RUNNER_TEMP/gvisor/runsc" "$RUNNER_TEMP/gvisor/containerd-shim-runsc-v1" \
            "$RUNNER_TEMP/gvisor/gvisor-bin" /usr/local/bin/
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # Read whole before tee opens it: tee empties it as it starts.
          daemon=$(sudo cat /etc/docker/daemon.json 2>/dev/null || echo '{}')
          jq '. + {experimental: true, runtimes: {runsc: {runtimeType: "io.containerd.runsc.v1"}}}' <<<"$daemon" |
            sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
      - run: bun run test:sandbox
