name: ci

# On demand only: every run provisions and tests the whole payload, and builds
# and tests the image from it.
on:
  workflow_dispatch:

permissions:
  contents: read

# Development telemetry goes where the repository's secrets and variables of
# these OpenTelemetry names say; with none set, nothing is exported. See
# packages/core/src/telemetry/config.ts.
env:
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT }}
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_METRICS_ENDPOINT }}
  OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_LOGS_ENDPOINT }}
  OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
  OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS }}
  OTEL_EXPORTER_OTLP_METRICS_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_METRICS_HEADERS }}
  OTEL_EXPORTER_OTLP_LOGS_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_LOGS_HEADERS }}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${{ vars.OTEL_EXPORTER_OTLP_PROTOCOL }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun run build
      # The payload, what provisions it, and the image built from it take more
      # disk than a runner starts with free.
      - run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/cache@v4
        with:
          path: .work
          key: payload-linux-x64-${{ hashFiles('tooling/src/platforms.ts', 'tooling/src/provision/clang.ts', 'packages/runtime-rust/native/**', 'packages/runtime-cpp/native/**', 'packages/runtime-lean/native/**', 'packages/runtime-go/native/**', 'toolbelt/**', 'skills/bayma-runtime-python/**') }}
      - run: bun run provision
      - run: bun run payload
      - run: bun run test
      - run: bun run image
      - run: bun run test:e2e
