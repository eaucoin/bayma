name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  payload-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run provision
      - run: bun run payload
      - uses: actions/upload-artifact@v4
        with:
          name: payload-linux-x64
          path: dist/bayma-payload-*.tar.gz

  payload-macos:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run provision
      - run: bun run payload
      - uses: actions/upload-artifact@v4
        with:
          name: payload-darwin-arm64
          path: dist/bayma-payload-*.tar.gz

  publish:
    needs: [payload-linux, payload-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: bun install --frozen-lockfile
      - run: bun run build
      # The release must exist, with its assets, before the package that points
      # at them. Both steps tolerate a re-run over an existing release.
      - run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "bayma ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" ./dist/bayma-payload-*.tar.gz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - run: bun run release
      - run: bun run pack
      - run: test "v$(node -p 'require("./packages/server/package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance ./dist/*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
