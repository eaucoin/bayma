name: release

# On demand only, from the version tag being released: publishes bayma's
# image to GitHub's container registry, attested, and the bayma command,
# pinned to the image by digest, to npm as the package `bayma-repl`, with
# provenance. This workflow is the package's trusted publisher on npm, which
# takes the run's OpenID Connect token from GitHub, so no npm token is kept.
on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

# Development telemetry goes where the repository's secrets and variables of
# these OpenTelemetry names say; with none set, nothing is exported. See
# packages/core/src/telemetry/config.ts.
env:
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT }}
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_METRICS_ENDPOINT }}
  OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_LOGS_ENDPOINT }}
  OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
  OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS }}
  OTEL_EXPORTER_OTLP_METRICS_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_METRICS_HEADERS }}
  OTEL_EXPORTER_OTLP_LOGS_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_LOGS_HEADERS }}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${{ vars.OTEL_EXPORTER_OTLP_PROTOCOL }}
  IMAGE: ghcr.io/eaucoin/bayma

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      # The image is tagged after the ref it runs from, so a run from a branch
      # must stop before it publishes one by the branch's name.
      - run: |
          [[ "$GITHUB_REF" == refs/tags/v* ]] ||
            { echo "::error::Run the release from a v* tag, not $GITHUB_REF"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Its npm, 11.5.1 or later, publishes as a trusted publisher.
          node-version: 24
      # The image and the bayma command are released at the tag's version.
      - run: |
          test "v$(bun -p 'require("./packages/server/package.json").version')" = "$GITHUB_REF_NAME"
          test "v$(bun -p 'require("./packages/cli/package.json").version')" = "$GITHUB_REF_NAME"
      - run: bun install --frozen-lockfile
      - run: bun run build
      # The payload and the image built from it take more disk than some
      # runners start with free.
      - run: |
          [ "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" -ge 40 ] ||
            sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The toolchains are the images the ci workflow pushed for this commit,
      # and tested; a release builds none, and fails if one is missing. The
      # summary names each by its digest.
      - run: |
          set -o pipefail
          bun run toolchains pull | tee "$RUNNER_TEMP/toolchains.txt"
          { echo "### Toolchains"; echo; echo '```'; grep "@sha256:" "$RUNNER_TEMP/toolchains.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - run: bun run payload
      - run: bun run image
      - id: push
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker tag "$IMAGE:$version" "$IMAGE:latest"
          docker push "$IMAGE:$version"
          docker push "$IMAGE:latest"
          digest="$(docker image inspect "$IMAGE:$version" --format '{{index .RepoDigests 0}}')"
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
      # The attestations alone, as the major before made: its storage records need the
      # artifact-metadata permission, of an organization's artifacts.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      # The bayma command runs the image just pushed, by its digest.
      - run: |
          bun run pin "$DIGEST"
          bun run build
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      # Published with provenance, as trusted publishing does by itself;
      # tolerates a re-run over a version npm has already.
      - working-directory: packages/cli
        run: |
          if npm view "bayma-repl@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "bayma-repl ${GITHUB_REF_NAME#v} is on npm already"
          else
            npm publish --access public
          fi
      # Tolerates a re-run over an existing release.
      - run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "bayma ${GITHUB_REF_NAME#v}" --generate-notes \
              --notes "Set it up, on Linux (x64) with Docker and Node 22 or later: \`npx bayma-repl@${GITHUB_REF_NAME#v} init\`"
        env:
          GH_TOKEN: ${{ github.token }}
