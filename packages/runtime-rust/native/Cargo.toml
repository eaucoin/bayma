[workspace]
members = ["bayma-rust-host", "bayma-rust-support"]
exclude = ["evcxr"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
crossbeam-channel = "=0.5.16"
ctrlc = "=3.5.1"
libc = "=0.2.189"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
