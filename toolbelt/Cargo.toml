[package]
name = "bayma-toolbelt"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"
publish = false

[lib]
path = "rust/src/lib.rs"
doctest = false

[[test]]
name = "packages"
path = "rust/tests/packages.rs"

[dependencies]
ast-grep-core = "=0.45.0"
blake3 = "=1.8.5"
ec4rs = { version = "=1.2.0", features = ["track-source"] }
encoding_rs = "=0.8.35"
gix = { version = "=0.87.1", default-features = false, features = ["sha1", "sha256", "status", "revision", "parallel"] }
globset = "=0.4.19"
grep = "=0.4.1"
ignore = "=0.4.31"
imara-diff = "=0.2.0"
json5 = "=1.3.1"
jsonc-parser = { version = "=0.33.1", features = ["cst", "serde", "preserve_order"] }
lru = "=0.18.1"
markdown = { version = "=1.0.0", features = ["serde"] }
parking_lot = "=0.12.5"
ra_ap_base_db = "=0.0.344"
ra_ap_cfg = "=0.0.344"
ra_ap_hir = "=0.0.344"
ra_ap_ide = "=0.0.344"
ra_ap_syntax = "=0.0.344"
rayon = "=1.12.0"
roxmltree = "=0.21.1"
saphyr = "=0.0.11"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tempfile = "=3.26.0"
thiserror = "=2.0.19"
toml_edit = { version = "=0.25.13", features = ["serde"] }
wait-timeout = "=0.2.1"
yaml-edit = "=0.2.3"
